<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><title>NEXOR FIT — Login visual</title><link rel="stylesheet" href="./nexor-visual-v2.css"><link rel="stylesheet" href="./nexor-visual-polish-v2.css"><style>body{margin:0;background:#050607}.nf-login{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 35px;position:relative;overflow:hidden}.nf-login-backdrop{position:absolute;inset:0 0 30%;background:radial-gradient(ellipse at 55% 35%,#fd741a44,transparent 35%),linear-gradient(155deg,#171b21,#050607 80%);z-index:0}.nf-login-backdrop:after{content:"N";font-size:min(115vw,510px);font-weight:1000;line-height:1;position:absolute;top:4%;left:50%;transform:translateX(-50%);color:#ffffff09;letter-spacing:-.13em}.nf-login-content{position:relative;z-index:1}.nf-login-mark{text-align:center;margin-bottom:38px}.nf-login-mark .nf-brand{font-size:clamp(47px,14vw,68px);letter-spacing:-.075em}.nf-login-mark p{color:#b8bdc5;font-size:12px;font-weight:800;letter-spacing:.17em;margin:8px 0}.nf-login-title{text-align:center;font-size:30px;font-weight:900;line-height:1.13;letter-spacing:-.04em;margin:0 0 12px}.nf-login-desc{text-align:center;color:#a6abb5;font-size:14px;line-height:1.5;margin:0 0 28px}.nf-login-actions{display:grid;gap:12px}.nf-login-actions .nf-button{width:100%}.nf-login-actions .nf-button:disabled{opacity:1;cursor:default}.nf-login-actions .nf-button--outline{background:#171b21;border-color:#343944;color:#fff}.nf-login-legal{font-size:11px;color:#858b94;text-align:center;line-height:1.5;margin:20px 0 0}.nf-login-demo{text-align:center;font-size:10px;color:#858b94;margin:14px 0 0}</style></head><body><main class="nf-shell nf-polished nf-login"><div class="nf-login-backdrop" aria-hidden="true"></div><div class="nf-login-content"><div class="nf-login-mark"><div class="nf-brand">NEXOR<span>FIT</span></div><p>SEU TREINO. SUA EVOLUÇÃO.</p></div><h1 class="nf-login-title">Sua melhor versão<br>começa aqui.</h1><p class="nf-login-desc">Treine com propósito. Acompanhe sua evolução e supere seus limites.</p><div class="nf-login-actions"><button type="button" class="nf-button" disabled>Continuar com Google</button><button type="button" class="nf-button nf-button--outline" disabled>Entrar com e-mail</button><button type="button" class="nf-button nf-button--outline" disabled>Criar minha conta</button></div><p class="nf-login-legal">Ao continuar, você concordará com os termos e a política de privacidade aplicáveis.</p><p class="nf-login-demo">DEMONSTRAÇÃO VISUAL · LOGIN DESATIVADO</p></div></main></body></html>
