<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><title>NEXOR FIT 2.0 — Evolução (prévia)</title><link rel="stylesheet" href="./nexor-visual-v2.css"><style>body{margin:0;background:#050607}.nf-note{font-size:12px;color:#a6abb5;border:1px dashed #555b65;border-radius:12px;padding:12px;margin:16px 0}.nf-chart{display:flex;align-items:end;gap:14px;height:210px;padding:18px 8px 28px;border-bottom:1px solid #515762}.nf-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px;min-width:0}.nf-bar{width:min(60px,100%);background:linear-gradient(#ffac56,#ff851b);border-radius:8px 8px 2px 2px;min-height:3px}.nf-chart-label{color:#a6abb5;font-size:11px;white-space:nowrap}.nf-chart-value{font-size:12px;font-weight:800}.nf-card h2{font-size:17px}</style></head>
<body><main class="nf-shell"><div class="nf-brand">NEXOR<span>FIT</span></div><h1 class="nf-heading">Sua evolução</h1><p class="nf-subtitle">Visualize sua consistência e seu volume de treino.</p><p class="nf-note">Indicadores e gráfico exclusivamente ilustrativos, sem conexão com dados reais.</p><div class="nf-stats" id="stats"></div><section class="nf-card" style="margin-top:18px"><h2>Volume por sessão</h2><p class="nf-muted" style="font-size:12px">Carga × repetições das séries concluídas (kg·rep)</p><div class="nf-chart" id="chart" role="img" aria-label="Gráfico ilustrativo de volume por sessão"></div></section><a href="./visual-history-v2.html" class="nf-button nf-button--outline" style="width:100%;margin-top:18px">Ver histórico →</a></main>
<nav class="nf-tabs" aria-label="Navegação ilustrativa"><button class="nf-tab" disabled>Início</button><button class="nf-tab" disabled>Sessão</button><button class="nf-tab" disabled>Treinos</button><button class="nf-tab" aria-current="page" disabled>Histórico</button><button class="nf-tab" disabled>Perfil</button></nav>
<script type="module">
import {demoHistory} from './nexor-visual-demo-history.js';import {summarizeWorkoutEvolution} from './nexor-visual-history.js';
const evolution=summarizeWorkoutEvolution(demoHistory);
const stats=document.getElementById('stats');
for(const [value,label] of [[evolution.sessions,'Treinos'],[evolution.totalCompletedSets,'Séries'],[Math.round(evolution.totalDurationSeconds/60)+' min','Tempo']]){const item=document.createElement('div');item.className='nf-card nf-stat';const strong=document.createElement('strong');strong.textContent=String(value);const small=document.createElement('small');small.textContent=label;item.append(strong,small);stats.appendChild(item)}
const chart=document.getElementById('chart'),max=Math.max(1,...evolution.trend.map(row=>row.volumeKg));
evolution.trend.forEach(row=>{const wrap=document.createElement('div');wrap.className='nf-bar-wrap';const value=document.createElement('span');value.className='nf-chart-value';value.textContent=String(Math.round(row.volumeKg));const bar=document.createElement('div');bar.className='nf-bar';bar.style.height=(100*row.volumeKg/max)+'%';const label=document.createElement('span');label.className='nf-chart-label';label.textContent=new Date(row.endedAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'UTC'});wrap.append(value,bar,label);chart.appendChild(wrap)});
</script></body></html>
