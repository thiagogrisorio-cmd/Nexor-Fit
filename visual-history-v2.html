<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><title>NEXOR FIT 2.0 — Histórico (prévia)</title><link rel="stylesheet" href="./nexor-visual-v2.css"><style>body{margin:0;background:#050607}.nf-note{font-size:12px;color:#a6abb5;border:1px dashed #555b65;border-radius:12px;padding:12px;margin:16px 0}.nf-history-item{margin:12px 0}.nf-history-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.nf-history-date{color:#ff851b;font-size:12px;font-weight:800}.nf-history-details{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#a6abb5;font-size:12px;margin-top:14px}</style></head>
<body><main class="nf-shell"><div class="nf-brand">NEXOR<span>FIT</span></div><h1 class="nf-heading">Histórico de treinos</h1><p class="nf-subtitle">Acompanhe as sessões concluídas e seus resultados.</p><p class="nf-note">Prévia demonstrativa: nenhum histórico de usuário foi acessado. Os números e datas são fictícios.</p><section id="history" aria-label="Sessões históricas ilustrativas"></section><a class="nf-button" href="./visual-evolution-v2.html" style="width:100%;margin-top:20px">Visualizar evolução →</a></main><nav class="nf-tabs" aria-label="Navegação ilustrativa"><button class="nf-tab" disabled>Início</button><button class="nf-tab" disabled>Sessão</button><button class="nf-tab" disabled>Treinos</button><button class="nf-tab" aria-current="page" disabled>Histórico</button><button class="nf-tab" disabled>Perfil</button></nav>
<script type="module">
import {demoHistory} from './nexor-visual-demo-history.js';import {summarizeWorkoutHistory} from './nexor-visual-history.js';
const root=document.getElementById('history');
for(const item of summarizeWorkoutHistory(demoHistory)){
 const article=document.createElement('article');article.className='nf-card nf-history-item';
 const top=document.createElement('div');top.className='nf-history-top';
 const heading=document.createElement('h2');heading.textContent=item.name;
 const date=document.createElement('span');date.className='nf-history-date';date.textContent=new Date(item.endedAt).toLocaleDateString('pt-BR',{timeZone:'UTC'});top.append(heading,date);
 const details=document.createElement('div');details.className='nf-history-details';
 for(const label of [item.exerciseCount+' exercícios',item.completedSets+'/'+item.totalSets+' séries',Math.round(item.durationSeconds/60)+' min',item.volumeKg.toLocaleString('pt-BR')+' kg·rep']){const span=document.createElement('span');span.textContent=label;details.appendChild(span)}
 article.append(top,details);root.appendChild(article);
}
</script></body></html>
