<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><title>NEXOR FIT 2.0 — Descanso (prévia)</title><link rel="stylesheet" href="./nexor-visual-v2.css"><style>body{margin:0;background:#050607}.nf-rest{text-align:center;min-height:85dvh;display:flex;flex-direction:column;justify-content:center}.nf-rest-time{font-size:clamp(64px,20vw,100px);font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:22px 0;color:#ff851b}.nf-rest-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nf-rest .nf-button{width:100%}.nf-rest-actions{display:grid;gap:12px;margin-top:24px}.nf-demo{color:#a6abb5;font-size:12px;margin:16px 0}.nf-rest-state{min-height:22px;color:#ffb679}</style></head>
<body><main class="nf-shell nf-rest"><div class="nf-eyebrow">Intervalo entre séries</div><h1 class="nf-heading">Hora de descansar</h1><p class="nf-subtitle">Recupere o fôlego antes da próxima série.</p><div class="nf-rest-time" id="clock" role="timer" aria-label="Tempo restante">01:30</div><div class="nf-progress" role="progressbar" id="progress" aria-label="Progresso do descanso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="fill"></span></div><p class="nf-rest-state" id="state" role="status" aria-live="polite"></p><div class="nf-rest-actions"><div class="nf-rest-controls"><button class="nf-button nf-button--outline" id="minus" type="button">−15 segundos</button><button class="nf-button nf-button--outline" id="plus" type="button">+15 segundos</button></div><button class="nf-button" id="skip" type="button">Pular descanso</button></div><p class="nf-demo">Contador local demonstrativo. Não registra, altera nem sincroniza treinos.</p></main>
<script type="module">
import {restTimerState,adjustRestDuration} from './nexor-visual-rest.js';
let durationSeconds=90,startedAt=performance.now(),stopped=false;
const clock=document.getElementById('clock'),state=document.getElementById('state'),progress=document.getElementById('progress'),fill=document.getElementById('fill');
const elapsed=()=>Math.max(0,(performance.now()-startedAt)/1000);
function render(){const status=restTimerState({durationSeconds,elapsedSeconds:stopped?durationSeconds:elapsed()});const remaining=status.remainingSeconds;clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');fill.style.setProperty('--nf-progress',status.progressPercent+'%');progress.setAttribute('aria-valuenow',String(status.progressPercent));if(status.finished){stopped=true;state.textContent='Descanso concluído. Pronto para a próxima série.';document.getElementById('skip').disabled=true;document.getElementById('minus').disabled=true;document.getElementById('plus').disabled=true;clearInterval(interval)}}
function adjust(delta){if(stopped)return;durationSeconds=adjustRestDuration({durationSeconds,elapsedSeconds:elapsed(),deltaSeconds:delta});render()}
document.getElementById('minus').addEventListener('click',()=>adjust(-15));
document.getElementById('plus').addEventListener('click',()=>adjust(15));
document.getElementById('skip').addEventListener('click',()=>{stopped=true;durationSeconds=0;render()});
const interval=setInterval(render,250);render();
</script></body></html>
