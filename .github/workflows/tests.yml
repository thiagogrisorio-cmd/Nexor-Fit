name: Nexor Fit tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feature/workout-sessions-v1]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run test:rules
  functions-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: functions
      - run: node --check index.js
        working-directory: functions
      - run: node --input-type=module -e "await import('./index.js'); console.log('Functions entrypoint loaded')"
        working-directory: functions
  functions-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm install
        working-directory: functions
      - run: npx firebase emulators:exec --project demo-nexor-fit-rules-test --only firestore "node --test tests/functions-summary-admin-firestore.test.mjs"
