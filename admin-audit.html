<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexor Fit | Auditoria V1/V2</title><style>:root{font-family:system-ui;color:#f5f5f5;background:#090909}body{max-width:940px;margin:auto;padding:28px 18px}h1{font-size:30px}h1 span{color:#ff8000}.note{color:#aaa;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.tile{background:#181818;border:1px solid #393939;border-radius:14px;padding:18px}.tile strong{display:block;color:#ff8c24;font-size:32px}.tile small{color:#bbb}.status{border-left:4px solid #ff8000;padding:14px;background:#1b1b1b;margin:16px 0}textarea{width:100%;min-height:170px;background:#151515;color:#eee;border:1px solid #555;border-radius:10px;padding:12px}button{background:#ff8000;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}li{margin:8px 0}</style></head><body><h1>Nexor <span>Fit</span> · Auditoria V1/V2</h1><p class="note">Ferramenta administrativa local e somente leitura. Cole abaixo um relatório agregado gerado pela auditoria autorizada. Esta página não acessa o Firebase, não mostra usuários e não altera sessões.</p><label for="report">Relatório JSON agregado</label><textarea id="report" spellcheck="false" placeholder="Cole o JSON do relatório consolidado"></textarea><p><button id="load" type="button">Analisar relatório</button></p><div id="output" role="status" aria-live="polite">Nenhum relatório carregado.</div><script type="module">import {auditDashboardModel} from './v1-retirement-audit-dashboard.js';const output=document.getElementById('output');document.getElementById('load').addEventListener('click',()=>{output.replaceChildren();try{const model=auditDashboardModel(JSON.parse(document.getElementById('report').value));const status=document.createElement('div');status.className='status';status.textContent=model.reviewOnly?'Elegível para revisão manual. Migração e deploy continuam sujeitos às demais verificações.':'Bloqueado para liberação. Verifique os indicadores e as pendências.';output.append(status);const grid=document.createElement('div');grid.className='grid';for(const metric of [...model.metrics,{label:'Proprietários ausentes',value:model.orphanOwners}]){const tile=document.createElement('div');tile.className='tile';const strong=document.createElement('strong');strong.textContent=String(metric.value);const label=document.createElement('small');label.textContent=metric.label;tile.append(strong,label);grid.append(tile);}output.append(grid);const heading=document.createElement('h2');heading.textContent='Pendências';output.append(heading);const list=document.createElement('ul');for(const issue of model.blockers){const li=document.createElement('li');li.textContent=issue.label;list.append(li);}if(!model.complete){const li=document.createElement('li');li.textContent='Cobertura da auditoria não confirmada';list.append(li);}if(!list.children.length){const li=document.createElement('li');li.textContent='Sem bloqueios neste relatório. Ainda é necessária a aprovação manual dos demais critérios.';list.append(li);}output.append(list);}catch(error){output.textContent='Não foi possível validar o relatório: '+error.message;}});</script></body></html>
